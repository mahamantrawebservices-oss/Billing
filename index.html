<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahamantra Web Services - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        window.FirebaseSDK = { initializeApp, getFirestore, collection, getDocs, doc, setDoc };
    </script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- ADMIN LOGIN MODAL -->
    <div id="admin-login-modal" class="fixed inset-0 bg-indigo-950 z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-6">
            <div class="text-center">
                <i class="fa-solid fa-user-shield text-5xl text-indigo-600 mb-2"></i>
                <h2 class="text-2xl font-bold text-slate-900">Admin Panel Login</h2>
            </div>
            <div class="space-y-4">
                <input type="password" id="admin-login-pass" placeholder="Enter Developer Password" class="w-full border rounded-lg p-3 text-sm">
                <button onclick="verifyAdminLogin()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold text-sm">Login</button>
            </div>
        </div>
    </div>

    <!-- ADMIN CONTENT -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
        <div class="bg-white rounded-xl shadow-md p-6">
            <h3 class="text-xl font-bold mb-4">Cloud User Management & Login History</h3>
            <div class="overflow-x-auto mb-6">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 uppercase text-xs border-b">
                            <th class="p-3">User ID</th><th class="p-3">Email</th><th class="p-3">Status</th><th class="p-3">Passkey</th><th class="p-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-users-table" class="divide-y"></tbody>
                </table>
            </div>

            <h4 class="font-bold text-sm mb-2">Recent 5 Login Sessions</h4>
            <table class="w-full text-left border-collapse text-sm">
                <thead><tr class="bg-slate-100 uppercase text-xs border-b"><th class="p-3">User ID</th><th class="p-3">Time</th><th class="p-3">Device</th></tr></thead>
                <tbody id="admin-login-history-table" class="divide-y"></tbody>
            </table>
        </div>
    </main>

    <script type="module">
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = window.FirebaseSDK.initializeApp(firebaseConfig);
        const db = window.FirebaseSDK.getFirestore(app);

        window.verifyAdminLogin = function() {
            const pass = document.getElementById('admin-login-pass').value.trim();
            if(pass === "admin123") { // Default password
                document.getElementById('admin-login-modal').classList.add('hidden');
                loadAdminData();
            } else {
                alert('Incorrect Developer Password!');
            }
        };

        async function loadAdminData() {
            // Load Users
            const usersSnap = await window.FirebaseSDK.getDocs(window.FirebaseSDK.collection(db, "users"));
            const tbody = document.getElementById('admin-users-table');
            tbody.innerHTML = '';
            usersSnap.forEach(docSnap => {
                const u = docSnap.data();
                tbody.innerHTML += `<tr><td class="p-3 font-semibold">${u.userId}</td><td class="p-3">${u.email}</td><td class="p-3 font-bold">${u.status}</td><td class="p-3 text-indigo-600 font-mono">${u.passkey || 'None'}</td><td class="p-3 text-center"><button onclick="updateStatus('${u.userId}', 'approved')" class="bg-emerald-600 text-white px-2 py-1 rounded text-xs">Approve</button> <button onclick="updateStatus('${u.userId}', 'blocked')" class="bg-amber-600 text-white px-2 py-1 rounded text-xs">Block</button> <button onclick="genPasskey('${u.userId}', '${u.email}')" class="bg-indigo-600 text-white px-2 py-1 rounded text-xs">Gen Passkey</button></td></tr>`;
            });

            // Load Login History
            const histSnap = await window.FirebaseSDK.getDocs(window.FirebaseSDK.collection(db, "loginHistory"));
            const histBody = document.getElementById('admin-login-history-table');
            histBody.innerHTML = '';
            histSnap.forEach(docSnap => {
                const h = docSnap.data();
                histBody.innerHTML += `<tr><td class="p-3 font-semibold">${h.userId}</td><td class="p-3">${h.time}</td><td class="p-3 text-xs font-mono">${h.device}</td></tr>`;
            });
        }

        window.updateStatus = async function(uid, status) {
            await window.FirebaseSDK.setDoc(window.FirebaseSDK.doc(db, "users", uid), { status }, { merge: true });
            alert('User status updated to ' + status);
            loadAdminData();
        };

        window.genPasskey = async function(uid, email) {
            const pk = 'PK-' + Math.floor(100000 + Math.random() * 900000);
            await window.FirebaseSDK.setDoc(window.FirebaseSDK.doc(db, "users", uid), { passkey: pk }, { merge: true });
            alert(`Passkey generated for ${email}: ${pk}`);
            loadAdminData();
        };
    </script>
</body>
</html>
